---
# Docker installation control
lidarr_install_docker: false

# Lidarr configuration
lidarr_plugins: false
lidarr_folder: /etc/lidarr
lidarr_music_folder: "{{ media_storage_base_path }}/music"
lidarr_transmission_downloads_folder: "{{ media_storage_base_path }}/downloads"
lidarr_sabnzbd_downloads_folder: "{{ media_storage_base_path }}/downloads"
lidarr_port: 8686
lidarr_tz: "America/Los_Angeles"
lidarr_memory: "1g"
lidarr_memory_swap: "1g"

# Docker network (use custom network for container name resolution)
lidarr_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of lidarr_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
lidarr_extra_volumes: []
