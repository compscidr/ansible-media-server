---
transmission_port: 9091
transmission_peer_port: 51413
transmission_folder: /etc/transmission
transmission_downloads_folder: "{{ media_storage_base_path }}/downloads"
transmission_tz: "America/Los_Angeles"
transmission_env_file: "{{ transmission_folder }}/.env"
transmission_memory: "1g"
transmission_memory_swap: "1g"

# Docker network (use custom network for container name resolution)
transmission_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of transmission_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
transmission_extra_volumes: []
