---
sabnzbd_folder: /etc/sabnzbd
sabnzbd_download_folder: "{{ media_storage_base_path }}/downloads"
sabnzbd_port: 8080
sabnzbd_tz: "America/Los_Angeles"
sabnzbd_memory: "1g"
sabnzbd_memory_swap: "1g"

# Docker network (use custom network for container name resolution)
sabnzbd_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Host whitelist for API access (required when using container names)
# Add container hostnames that will connect to sabnzbd
sabnzbd_host_whitelist: "sabnzbd, sonarr, radarr, lidarr, prowlarr"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of sabnzbd_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
sabnzbd_extra_volumes: []
