---
# Docker installation control
soularr_install_docker: false

# soularr configuration
soularr_folder: /etc/soularr
soularr_downloads_folder: "{{ media_storage_base_path }}/downloads/complete/music"
soularr_memory: "1g"
soularr_memory_swap: "1g"

# Docker network (use custom network for container name resolution)
soularr_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of soularr_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
soularr_extra_volumes: []
