---
jackett_folder: /etc/jackett
jackett_download_folder: "{{ media_storage_base_path }}/downloads"
jackett_port: 9117
jackett_tz: "America/Los_Angeles"
jackett_memory: "1g"

# Docker network (use custom network for container name resolution)
jackett_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of jackett_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
jackett_extra_volumes: []
