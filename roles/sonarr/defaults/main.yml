---
# Docker installation control
sonarr_install_docker: false

# Sonarr configuration
sonarr_folder: /etc/sonarr
sonarr_tv_folder: "{{ media_storage_base_path }}/tv"
sonarr_transmissions_downloads_folder: "{{ media_storage_base_path }}/downloads"
sonarr_sabnzbd_downloads_folder: "{{ media_storage_base_path }}/downloads"
sonarr_port: 8989
sonarr_tz: "America/Los_Angeles"
sonarr_memory: "1g"
sonarr_memory_swap: "1g"

# Reverse proxy / SSL (nginx-proxy + letsencrypt companion)
sonarr_virtual_host: ""
sonarr_virtual_port: "8989"
sonarr_letsencrypt_host: "{{ sonarr_virtual_host }}"
sonarr_letsencrypt_email: ""

# Docker network (use custom network for container name resolution)
sonarr_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of sonarr_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
sonarr_extra_volumes: []
