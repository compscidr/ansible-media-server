---
# Docker installation control
radarr_install_docker: false

# Radarr configuration
radarr_folder: /etc/radarr
radarr_movies_folder: "{{ media_storage_base_path }}/movies"
radarr_transmission_downloads_folder: "{{ media_storage_base_path }}/downloads"
radarr_sabnzbd_downloads_folder: "{{ media_storage_base_path }}/downloads"
radarr_port: 7878
radarr_tz: "America/Los_Angeles"
radarr_memory: "1g"
radarr_memory_swap: "1g"

# Reverse proxy / SSL (nginx-proxy + letsencrypt companion)
radarr_virtual_host: ""
radarr_virtual_port: "7878"
radarr_letsencrypt_host: "{{ radarr_virtual_host }}"
radarr_letsencrypt_email: ""

# Docker network (use custom network for container name resolution)
radarr_networks: "{{ [{'name': media_storage_network_name}] if media_storage_network_enabled | default(false) else [] }}"

# Extra bind mounts appended to the container's volumes, in docker "src:dst[:mode]"
# form. Lets a subdirectory of radarr_folder (a database, an artwork cache, logs) be
# placed elsewhere without giving up the config path.
radarr_extra_volumes: []
